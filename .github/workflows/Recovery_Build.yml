name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: true
        default: 'PLACEHOLDER'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'PLACEHOLDER'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'PLACEHOLDER'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'PLACEHOLDER'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'PLACEHOLDER'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'PLACEHOLDER'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'PLACEHOLDER'
      BUILD_TARGET:
        description: 'BUILD_TARGET (recovery / boot / vendor_boot)'
        required: true
        default: 'PLACEHOLDER'
      LUNCH_VARIANT:
        description: 'Varian lunch (eng / userdebug / user)'
        required: true
        default: 'eng'
      USER_NAME:
        description: 'Git Username'
        required: true
        default: 'PLACEHOLDER'
      USER_EMAIL:
        description: 'Git Email'
        required: true
        default: 'PLACEHOLDER'

concurrency:
  group: recovery-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    permissions:
      contents: write

    # Semua input lewat env (bukan di-interpolasi langsung ke script)
    # supaya aman dari injeksi shell dan nilai dengan spasi/karakter khusus.
    env:
      MANIFEST_URL: ${{ inputs.MANIFEST_URL }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      MAKEFILE_NAME: ${{ inputs.MAKEFILE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      LUNCH_VARIANT: ${{ inputs.LUNCH_VARIANT }}
      USER_NAME: ${{ inputs.USER_NAME }}
      USER_EMAIL: ${{ inputs.USER_EMAIL }}
      WORKSPACE_DIR: ${{ github.workspace }}/workspace

    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: $MANIFEST_URL"
        echo "Manifest Branch: $MANIFEST_BRANCH"
        echo "Device Tree URL: $DEVICE_TREE_URL"
        echo "Device Tree Branch: $DEVICE_TREE_BRANCH"
        echo "Device Path: $DEVICE_PATH"
        echo "Device Name: $DEVICE_NAME"
        echo "Makefile Name: $MAKEFILE_NAME-$LUNCH_VARIANT"
        echo "Build Target: $BUILD_TARGET.img"
        echo "::endgroup::"

        # Validasi cepat supaya gagal di awal, bukan setelah sync berjam-jam
        for v in MANIFEST_URL MANIFEST_BRANCH DEVICE_TREE_URL DEVICE_TREE_BRANCH \
                 DEVICE_PATH DEVICE_NAME MAKEFILE_NAME BUILD_TARGET; do
          [ "${!v}" != "PLACEHOLDER" ] && [ -n "${!v}" ] || { echo "❌ Input $v belum diisi"; exit 1; }
        done
        case "$DEVICE_PATH" in
          /*|*..*) echo "❌ DEVICE_PATH tidak valid: $DEVICE_PATH"; exit 1 ;;
        esac

    - name: Check Out
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    # Java dipasang SEBELUM script build env, supaya JAVA_HOME sudah valid
    # saat script (dan install_android_sdk.sh) dijalankan.
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Prepare the environment
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y git aria2 curl

        mkdir -p ofx_scripts && cd ofx_scripts
        git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts
        cd scripts

        # Script ini kadang mengharapkan JAVA_HOME tertentu; arahkan ke Java yang aktif
        export JAVA_HOME="${JAVA_HOME_17_X64:-${JAVA_HOME:-}}"
        sudo --preserve-env=JAVA_HOME bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo --preserve-env=JAVA_HOME bash setup/install_android_sdk.sh

    - name: Verifikasi JAVA_HOME
      run: |
        set -euo pipefail
        if [ ! -x "${JAVA_HOME:-}/bin/javac" ]; then
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
        fi
        echo "JAVA_HOME=$JAVA_HOME"
        "$JAVA_HOME/bin/javac" -version

    - name: Setup SSH Keys
      if: ${{ startsWith(inputs.MANIFEST_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        set -euo pipefail
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        repo --version | head -n 3

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Initialize repo
      run: |
        set -euo pipefail
        mkdir -p "$WORKSPACE_DIR"
        cd "$WORKSPACE_DIR"
        git config --global user.name "$USER_NAME"
        git config --global user.email "$USER_EMAIL"
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60
        git config --global http.version HTTP/1.1
        repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"

    - name: Repo Sync
      working-directory: ${{ env.WORKSPACE_DIR }}
      run: |
        # Kegagalan fetch ke external/libvpx & external/libwebm (googlesource) umumnya
        # sementara/rate-limit. Coba ulang dengan paralelisme makin kecil dan jeda makin lama.
        ok=0
        for attempt in 1 2 3 4 5; do
          case "$attempt" in 1|2) jobs=4 ;; 3) jobs=2 ;; *) jobs=1 ;; esac
          echo "▶ repo sync percobaan $attempt/5 (-j$jobs)"
          if repo sync -c -j"$jobs" --no-clone-bundle --no-tags --optimized-fetch \
               --prune --force-sync --retry-fetches=3; then
            ok=1
            break
          fi
          echo "⚠️ Gagal, menunggu $((attempt * 20)) detik..."
          sleep $((attempt * 20))
        done
        [ "$ok" = "1" ] || { echo "❌ repo sync gagal setelah 5 percobaan"; exit 1; }
        df -h / | tail -n 1

    - name: Clone device tree
      working-directory: ${{ env.WORKSPACE_DIR }}
      run: |
        set -euo pipefail
        rm -rf "./$DEVICE_PATH"
        git clone --depth=1 -b "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" "./$DEVICE_PATH"
        ls "./$DEVICE_PATH" | head -n 30

    - name: Building recovery
      working-directory: ${{ env.WORKSPACE_DIR }}
      run: |
        # envsetup.sh tidak aman dengan 'set -e', jadi hanya pipefail + cek manual
        set -o pipefail
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch "${MAKEFILE_NAME}-${LUNCH_VARIANT}" || { echo "❌ lunch gagal"; exit 1; }
        make "${BUILD_TARGET}image" -j"$(nproc --all)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

    - name: Cek hasil build
      run: |
        out="workspace/out/target/product/$DEVICE_NAME"
        test -f "$out/$BUILD_TARGET.img" || { echo "❌ $BUILD_TARGET.img tidak ditemukan"; ls -la "$out" || true; exit 1; }
        ls -lh "$out/$BUILD_TARGET.img"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.DEVICE_NAME }}-${{ inputs.BUILD_TARGET }}-${{ github.run_id }}
        path: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
        if-no-files-found: error

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*vendor*.img
        name: ${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
          Device: ${{ inputs.DEVICE_NAME }}
          Target: ${{ inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload log build (jika gagal)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_id }}
        path: build.log
        if-no-files-found: ignore
